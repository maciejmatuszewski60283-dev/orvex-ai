<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Tytuł strony (kluczowy dla Google) -->
  <title>ORVEX AI — Najlepsze AI i piękna strona internetowa</title>
  
  <!-- SEO Meta Tagi - Rozbudowane o Twoje słowa kluczowe -->
  <meta name="description" content="Poznaj ORVEX AI. Zastanawiasz się jakie jest najlepsze AI? ORVEX to zaawansowany system neuralny, który łączy w sobie potężną inteligencję i nowoczesny design. Piękna strona internetowa, która zmienia sposób, w jaki pracujesz.">
  <meta name="keywords" content="ORVEX, AI, sztuczna inteligencja, najlepsze ai, jakie jest najlepsze ai, piękna strona internetowa, nowoczesny design, chat gpt alternatywa, zaawansowany asystent">
  <meta name="author" content="Maciej">

  <!-- Open Graph / Social Media (Wygląd linku na Facebooku/Discordzie) -->
  <meta property="og:title" content="ORVEX AI — Jakie jest najlepsze AI?">
  <meta property="og:description" content="Odkryj ORVEX AI – połączenie potężnej inteligencji i pięknego designu.">
  <meta property="og:type" content="website">
  
  <!-- Stylizacja paska przeglądarki w telefonie -->
  <meta name="theme-color" content="#08090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Ikona / Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">

  <!-- Czcionki i Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Pasek górny (Header) -->
    <header class="chat-header">
      <div class="header-left">
        <div class="logo-mini">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
      <linearGradient id="orvexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#9d4edd" />
      </linearGradient>
      <filter id="neonGlow1" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <rect x="5" y="5" width="90" height="90" rx="22" fill="#0d0f18" stroke="url(#orvexGrad1)" stroke-width="2"/>
    <path d="M30 32 L50 68 L70 32" fill="none" stroke="url(#orvexGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow1)"/>
    <circle cx="50" cy="44" r="4" fill="#00f0ff" filter="url(#neonGlow1)"/>
  </svg>
</div>

        <div class="model-info">
          <h2>ORVEX <span>AI</span></h2>
          <p id="user-greeting">Wczytywanie...</p>
        </div>
      </div>
      <div class="header-right">
        <button id="logout-btn" class="icon-btn" title="Wyloguj">
          <i class="ri-logout-circle-r-line"></i>
        </button>
      </div>
    </header>

    <!-- Obszar czatu (Wiadomości) -->
    <main class="chat-box" id="chat-box">
      <!-- Wiadomość powitalna od AI -->
      <div class="message ai-message">
        <div class="avatar">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80%" height="80%">
    <defs>
      <linearGradient id="orvexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#9d4edd" />
      </linearGradient>
    </defs>
    <rect x="5" y="5" width="90" height="90" rx="22" fill="#0d0f18" stroke="url(#orvexGrad2)" stroke-width="2"/>
    <path d="M30 32 L50 68 L70 32" fill="none" stroke="url(#orvexGrad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="44" r="4" fill="#00f0ff"/>
  </svg>
</div>
        <div class="bubble">
          <p>Witaj w panelu głównym. Jestem ORVEX. W czym mogę Ci dzisiaj pomóc?</p>
        </div>
      </div>
      <!-- Tutaj będą pojawiać się kolejne wiadomości -->
    </main>

    <!-- Pasek dolny (Wprowadzanie tekstu i zdjęć) -->
    <footer class="chat-input-area">
      
      <!-- Podgląd wgranego zdjęcia (ukryty domyślnie) -->
      <div id="image-preview-container" class="image-preview-container hidden">
        <img id="image-preview" src="" alt="Podgląd">
        <button id="remove-image-btn" class="remove-image-btn"><i class="ri-close-line"></i></button>
      </div>

      <form id="chat-form" class="input-form">
        <button type="button" id="upload-btn" class="action-btn">
          <i class="ri-image-add-line"></i>
        </button>
        <input type="file" id="file-input" accept="image/*" class="hidden">
        
        <div class="textarea-wrapper">
          <textarea id="message-input" placeholder="Napisz do ORVEX..." rows="1"></textarea>
        </div>
        
        <button type="submit" id="send-btn" class="send-btn">
          <i class="ri-send-plane-fill"></i>
        </button>
      </form>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
